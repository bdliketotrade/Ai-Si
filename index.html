<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080a10">
<meta name="description" content="PROTOTYPE — a cinematic gaming identity, tactical loadout and digital showcase.">
<title>PROTOTYPE // P1</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #080a10;
  --panel: rgba(15, 19, 29, .78);
  --panel-2: #111622;
  --line: rgba(163, 180, 211, .13);
  --text: #f2f5fc;
  --muted: #8a94a8;
  --cyan: #6cf5ff;
  --blue: #489bff;
  --pink: #ff4cba;
  --lime: #c9ff77;
  --mono: "Space Mono", monospace;
  --display: "Barlow Condensed", sans-serif;
  --body: "Inter", sans-serif;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scrollbar-color: #253747 #080a10;
  scrollbar-width: thin;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -2;
  background:
    radial-gradient(ellipse at 78% 23%, rgba(37, 104, 143, .18), transparent 38%),
    radial-gradient(ellipse at 12% 68%, rgba(98, 36, 104, .13), transparent 34%),
    linear-gradient(135deg, #080a10 0%, #0b101a 48%, #080a10 100%);
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
  opacity: .14;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.94' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E");
  mix-blend-mode: screen;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; }

::selection {
  background: var(--cyan);
  color: #061017;
}

#particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

.scanline {
  position: fixed;
  z-index: 10;
  inset: -30% 0 auto;
  height: 140px;
  pointer-events: none;
  background: linear-gradient(transparent, rgba(108,245,255,.035), transparent);
  animation: scan 12s linear infinite;
}

@keyframes scan {
  from { transform: translateY(-10vh); }
  to { transform: translateY(120vh); }
}

@keyframes pulse {
  0%,100% { opacity: .55; }
  50% { opacity: 1; }
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

@keyframes blink {
  0%,49% { opacity: 1; }
  50%,100% { opacity: .3; }
}

@keyframes enter {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.wrap {
  width: min(1280px, calc(100% - 48px));
  margin: 0 auto;
}

.topline {
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
  box-shadow: 0 0 22px rgba(108,245,255,.25);
}

header {
  position: relative;
  z-index: 30;
  border-bottom: 1px solid var(--line);
  background: rgba(8,10,16,.78);
  backdrop-filter: blur(20px);
}

.nav {
  min-height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--display);
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 1.4px;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 35px;
  height: 35px;
  border: 1px solid var(--cyan);
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 15px;
  transform: rotate(-45deg);
  box-shadow: inset 0 0 14px rgba(108,245,255,.08), 0 0 15px rgba(108,245,255,.08);
}

.brand-mark span { transform: rotate(45deg); }

.brand em {
  color: var(--cyan);
  font-style: normal;
}

.nav-links {
  display: flex;
  gap: 29px;
  align-items: center;
}

.nav-links a {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
  transition: color .2s;
}

.nav-links a:hover { color: var(--cyan); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.online {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #b9c4d5;
  font: 10px var(--mono);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 12px var(--lime);
  animation: pulse 2s infinite;
}

.menu-btn {
  display: none;
  border: 1px solid var(--line);
  background: transparent;
  color: white;
  padding: 8px 11px;
  cursor: pointer;
}

main { padding-bottom: 65px; }

.hero {
  display: grid;
  grid-template-columns: 1fr 1.08fr;
  gap: 25px;
  min-height: 650px;
  align-items: center;
  padding-top: 35px;
  animation: enter .8s ease both;
}

.hero-copy { position: relative; z-index: 2; }

.eyebrow {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--cyan);
  font: 10px var(--mono);
  letter-spacing: 2px;
  margin-bottom: 24px;
}

.eyebrow::before {
  content: "";
  width: 30px;
  height: 1px;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
}

h1 {
  font-family: var(--display);
  font-size: clamp(76px, 10.3vw, 145px);
  line-height: .78;
  letter-spacing: -4px;
  font-weight: 900;
  margin: 0 0 24px;
  text-transform: uppercase;
}

h1 .outline {
  color: transparent;
  -webkit-text-stroke: 1px rgba(231,240,255,.66);
}

h1 .cyan { color: var(--cyan); }

.hero-sub {
  max-width: 430px;
  color: #9ca8bc;
  font-size: 13px;
  line-height: 1.9;
  margin-bottom: 27px;
}

.hero-sub strong { color: #e9f5ff; font-weight: 600; }

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 35px;
}

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 45px;
  padding: 0 20px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.025);
  color: #dce8f8;
  font: 10px var(--mono);
  letter-spacing: .7px;
  cursor: pointer;
  transition: .25s ease;
  overflow: hidden;
}

.btn-primary {
  color: #071016;
  background: var(--cyan);
  border-color: var(--cyan);
  font-weight: 700;
}

.btn-primary:hover {
  background: #d4fcff;
  box-shadow: 0 0 30px rgba(108,245,255,.25);
  transform: translateY(-2px);
}

.btn-secondary:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  transform: translateY(-2px);
}

.hero-meta {
  display: flex;
  gap: 30px;
  border-top: 1px solid var(--line);
  padding-top: 20px;
}

.meta-label {
  color: #707d91;
  font: 9px var(--mono);
  letter-spacing: 1px;
  margin-bottom: 7px;
}

.meta-value {
  font: 14px var(--display);
  font-weight: 700;
  letter-spacing: .7px;
}

.meta-value span { color: var(--cyan); }

.hero-art {
  position: relative;
  min-width: 0;
  height: 570px;
  border: 1px solid rgba(108,245,255,.15);
  background:
    linear-gradient(135deg, rgba(108,245,255,.04), transparent 35%),
    linear-gradient(0deg, rgba(8,10,16,.95), transparent 50%),
    radial-gradient(ellipse at 54% 39%, rgba(47,116,153,.19), transparent 53%),
    #0c111b;
  overflow: hidden;
  isolation: isolate;
}

.hero-art::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .45;
  background-image:
    linear-gradient(rgba(108,245,255,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(108,245,255,.055) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: linear-gradient(to bottom, black, transparent 90%);
}

.hero-art::after {
  content: "";
  position: absolute;
  width: 370px;
  height: 370px;
  border: 1px solid rgba(108,245,255,.17);
  border-radius: 50%;
  left: 50%;
  top: 43%;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 0 35px rgba(108,245,255,.018), 0 0 0 70px rgba(108,245,255,.015);
  pointer-events: none;
}

.art-top {
  position: absolute;
  z-index: 4;
  top: 19px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  color: #7e91a9;
  font: 9px var(--mono);
  letter-spacing: 1px;
}

.art-top .rec { color: #ff7a9e; }

.art-top .rec::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 8px;
  background: #ff557e;
  border-radius: 50%;
  animation: blink 1s infinite;
}

.character {
  position: absolute;
  z-index: 2;
  width: min(100%, 490px);
  left: 50%;
  top: 47%;
  transform: translate(-50%,-50%);
  filter: drop-shadow(0 12px 25px rgba(0,0,0,.6));
  animation: float 5s ease-in-out infinite;
}

.art-index {
  position: absolute;
  z-index: 3;
  right: 15px;
  top: 27%;
  font: 9px var(--mono);
  writing-mode: vertical-rl;
  letter-spacing: 3px;
  color: rgba(108,245,255,.58);
}

.art-bottom {
  position: absolute;
  z-index: 5;
  left: 20px;
  right: 20px;
  bottom: 20px;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 15px;
}

.character-name {
  font: 800 35px/.95 var(--display);
  letter-spacing: 1px;
}

.character-name span {
  display: block;
  color: var(--cyan);
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 10px;
}

.character-rank {
  border: 1px solid rgba(108,245,255,.25);
  padding: 10px 12px;
  background: rgba(8,10,16,.65);
  font: 9px var(--mono);
  line-height: 1.8;
  color: #a9bbcf;
}

.character-rank strong { color: var(--cyan); }

.corner {
  position: absolute;
  z-index: 4;
  width: 23px;
  height: 23px;
  pointer-events: none;
}

.corner.tl { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
.corner.tr { top: -1px; right: -1px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
.corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
.corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

.ticker {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
  background: rgba(255,255,255,.018);
}

.ticker-track {
  display: flex;
  width: max-content;
  animation: ticker 32s linear infinite;
}

.ticker:hover .ticker-track { animation-play-state: paused; }

.ticker-content {
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 16px 13px;
  color: #77859a;
  font: 10px var(--mono);
  letter-spacing: 1.2px;
  white-space: nowrap;
}

.ticker-content b { color: var(--cyan); font-weight: 400; }

@keyframes ticker {
  to { transform: translateX(-50%); }
}

.section {
  padding-top: 85px;
  scroll-margin-top: 30px;
}

.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
}

.section-tag {
  color: var(--cyan);
  font: 10px var(--mono);
  letter-spacing: 2px;
  margin-bottom: 9px;
}

.section-title {
  margin: 0;
  font: 800 clamp(32px,5vw,51px)/.95 var(--display);
  letter-spacing: .4px;
}

.section-title span { color: var(--cyan); }

.section-note {
  color: var(--muted);
  font: 10px var(--mono);
  line-height: 1.8;
  text-align: right;
}

.panel {
  background: linear-gradient(145deg, rgba(18,24,36,.9), rgba(11,14,22,.78));
  border: 1px solid var(--line);
  position: relative;
}

.panel:hover { border-color: rgba(108,245,255,.28); }

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 17px 20px;
  border-bottom: 1px solid var(--line);
  color: #8c9cb1;
  font: 10px var(--mono);
  letter-spacing: .7px;
}

.panel-head .small-status { color: var(--lime); }

.profile-grid {
  display: grid;
  grid-template-columns: .9fr 1.1fr;
  gap: 18px;
}

.profile-card { padding: 26px; }

.profile-top {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 27px;
}

.avatar {
  position: relative;
  display: grid;
  place-items: center;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
  background: linear-gradient(135deg, #142a36, #1b172d);
  border: 1px solid rgba(108,245,255,.45);
  color: var(--cyan);
  font: 700 30px var(--display);
}

.avatar::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(108,245,255,.15);
}

.profile-name {
  font: 800 29px var(--display);
  letter-spacing: 1px;
}

.profile-id {
  color: #8190a5;
  font: 10px var(--mono);
  margin-top: 6px;
}

.profile-id span { color: var(--cyan); }

.badge {
  display: inline-flex;
  padding: 6px 8px;
  margin-top: 10px;
  color: var(--lime);
  background: rgba(201,255,119,.07);
  border: 1px solid rgba(201,255,119,.19);
  font: 9px var(--mono);
  letter-spacing: .6px;
}

.profile-description {
  color: #9ba8bb;
  font-size: 12px;
  line-height: 1.9;
  margin-bottom: 24px;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  border: 1px solid var(--line);
}

.stat {
  padding: 15px 10px;
  border-right: 1px solid var(--line);
}

.stat:last-child { border-right: 0; }

.stat-number {
  font: 800 27px var(--display);
  margin-bottom: 4px;
}

.stat-number small { color: var(--cyan); font-size: 14px; }

.stat-label {
  color: #77859a;
  font: 8px var(--mono);
  letter-spacing: .7px;
}

.info-card { padding: 0; }

.info-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 15px;
  padding: 17px 20px;
  border-bottom: 1px solid var(--line);
  font-size: 11px;
}

.info-row:last-child { border-bottom: 0; }

.info-label {
  color: #738198;
  font: 9px var(--mono);
  letter-spacing: .5px;
}

.info-value { color: #e1eaf7; line-height: 1.6; }

.info-value .accent { color: var(--cyan); }
.info-value .rare { color: var(--pink); }

.loadout-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 15px;
}

.item-card {
  overflow: hidden;
  transition: transform .25s, border-color .25s;
}

.item-card:hover {
  transform: translateY(-5px);
  border-color: rgba(108,245,255,.42);
}

.item-visual {
  position: relative;
  display: grid;
  place-items: center;
  height: 180px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 55%, rgba(108,245,255,.11), transparent 55%),
    repeating-linear-gradient(135deg, transparent 0 15px, rgba(255,255,255,.015) 15px 16px);
}

.item-visual svg {
  width: 90%;
  max-height: 145px;
  filter: drop-shadow(0 6px 15px rgba(0,0,0,.5));
  transition: transform .35s;
}

.item-card:hover .item-visual svg { transform: scale(1.08) rotate(-2deg); }

.item-tier {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 5px 7px;
  background: rgba(8,10,16,.8);
  border: 1px solid var(--line);
  color: var(--cyan);
  font: 8px var(--mono);
}

.item-number {
  position: absolute;
  right: 12px;
  top: 12px;
  color: rgba(255,255,255,.25);
  font: 10px var(--mono);
}

.item-info { padding: 17px; border-top: 1px solid var(--line); }

.item-type {
  color: #75849a;
  font: 9px var(--mono);
  letter-spacing: 1px;
  margin-bottom: 7px;
}

.item-name {
  font: 700 24px var(--display);
  letter-spacing: .5px;
}

.item-description {
  color: #8996aa;
  font-size: 10px;
  line-height: 1.8;
  margin-top: 9px;
  min-height: 36px;
}

.item-bottom {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 17px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  color: #7f8da2;
  font: 8px var(--mono);
}

.item-bottom span:last-child { color: var(--lime); }

.system-grid {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 18px;
}

.system-panel { padding: 24px; }

.system-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font: 700 22px var(--display);
  margin-bottom: 7px;
}

.system-sub {
  color: #7f8ba0;
  font: 9px var(--mono);
  margin-bottom: 25px;
}

.progress-row { margin: 18px 0; }

.progress-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  font: 10px var(--mono);
  margin-bottom: 9px;
}

.progress-top span:first-child { color: #b6c3d6; }
.progress-top span:last-child { color: var(--cyan); }

.progress {
  height: 4px;
  background: #242c3b;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  width: var(--w);
  background: linear-gradient(90deg, #3985ff, var(--cyan));
  box-shadow: 0 0 12px rgba(108,245,255,.3);
  transform-origin: left;
  animation: barIn 1.4s ease both;
}

@keyframes barIn {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

.console {
  background: #080b11;
  border: 1px solid var(--line);
  padding: 19px;
  font: 10px/2 var(--mono);
  color: #8b9bb0;
}

.console-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--cyan);
  border-bottom: 1px solid var(--line);
  padding-bottom: 11px;
  margin-bottom: 12px;
}

.console-line {
  display: flex;
  gap: 10px;
}

.console-line .prompt { color: var(--lime); }
.console-line .result { color: #d4deeb; }

.console-cursor {
  display: inline-block;
  width: 6px;
  height: 12px;
  background: var(--cyan);
  vertical-align: middle;
  animation: blink .8s infinite;
}

.transmission {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 30px;
  padding: 31px;
  overflow: hidden;
}

.transmission::after {
  content: "P1";
  position: absolute;
  right: 100px;
  top: -50px;
  font: 900 180px var(--display);
  color: rgba(108,245,255,.035);
  pointer-events: none;
}

.transmission-label {
  color: var(--cyan);
  font: 9px var(--mono);
  letter-spacing: 2px;
  margin-bottom: 15px;
}

.transmission blockquote {
  position: relative;
  z-index: 1;
  margin: 0;
  font: 700 clamp(25px,4vw,42px)/1.1 var(--display);
  max-width: 700px;
}

.transmission blockquote span { color: var(--cyan); }

.transmission-by {
  color: #7f8ba0;
  font: 9px var(--mono);
  margin-top: 18px;
}

.signal-icon {
  display: grid;
  place-items: center;
  width: 74px;
  height: 74px;
  border: 1px solid rgba(108,245,255,.4);
  color: var(--cyan);
  font: 30px var(--display);
  transform: rotate(45deg);
}

.signal-icon span { transform: rotate(-45deg); }

footer {
  border-top: 1px solid var(--line);
  background: rgba(6,8,13,.7);
}

.footer-inner {
  min-height: 90px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.footer-brand {
  font: 700 19px var(--display);
  letter-spacing: 1px;
}

.footer-brand span { color: var(--cyan); }

.footer-copy {
  color: #667388;
  font: 9px/1.8 var(--mono);
}

.footer-right {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #8491a4;
  font: 9px var(--mono);
}

.footer-right .dot { width: 6px; height: 6px; }

.toast {
  position: fixed;
  z-index: 100;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  padding: 14px 19px;
  color: var(--cyan);
  background: #111925;
  border: 1px solid rgba(108,245,255,.4);
  box-shadow: 0 10px 40px #0008;
  font: 10px var(--mono);
  transition: .3s;
  text-align: center;
  width: max-content;
  max-width: calc(100% - 30px);
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

.reveal {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity .65s ease, transform .65s ease;
}

.reveal.visible { opacity: 1; transform: translateY(0); }

#clock { font-variant-numeric: tabular-nums; }

@media (min-width: 1500px) {
  .hero { min-height: 720px; }
  .hero-art { height: 620px; }
}

@media (max-width: 900px) {
  .hero {
    grid-template-columns: 1fr;
    padding-top: 55px;
    gap: 40px;
  }

  .hero-art { height: 590px; }
